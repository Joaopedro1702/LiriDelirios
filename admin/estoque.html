<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../stylepadrao.css">
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        gestao-estoque {
            padding: 20px;
        }
        .gestao-estoque h2 {
            margin-bottom: 20px;
            text-align: center;
        }
        #tabela-estoque {
            width: 100%;
            border-collapse: collapse;
        }
        #tabela-estoque th,
        #tabela-estoque td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }
        .adcProduto {
            margin-top: 40px;
            padding: 20px;
            border: 1px solid #ccc;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .adcProduto label,
        .adcProduto input,
        .adcProduto select,
        .adcProduto button{
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .adcProduto .linha{
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
        }
    </style>
    <title>Estoque</title>
</head>
<body>
        <header class="header">
        <img src="../imagem/logolirios.png" alt="Logo Liri Delirios" class="logo">
    </header>
        <nav class="nav">
    <ul>
        <li><a href="#">Gestão de estoque</a></li>
        <li><a href="#">Vestidos</a></li>
    </ul>
</nav>
<main>

    <div class="gestao-estoque">
        <h2>Gestão de estoque - Liri de Lírios</h2>
        <table id="tabela-estoque">
            <thead>
                <tr>
                    <th>Foto</th>
                    <th>Produtos</th>
                    <th>Categoria</th>
                    <th>Qtd</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="listar-produtos-estoque"></tbody>
        </table>
    </div>

    <section class="adcProduto">
        <h2>Adicionar produto</h2>
        <form class="adicionarProduto" >
            <label class="labels">Nome do produto: </label>
            <input type="text" id="nome-produto" placeholder="Nome do produto">
            <label class="labels">Valor do produto: </label>
            <input type="text" id="valor-produto" placeholder="valor do produto">
            <label class="labels">Descrição do produto: </label>
            <input type="text" id="descricao-produto" placeholder="Descrição do produto">
            <label class="labels">Categoria do produto: </label>
            <input type="text" id="categoria-produto" placeholder="Categoria do produto">
            <label>Quantidade por tamanho:</label>
                    <div class="campo-grupo">
                        <div class="campo">
                            <label>P</label>
                            <input type="number" id="qtd-p" placeholder="0" min="0">
                        </div>
                        <div class="campo">
                            <label>M</label>
                            <input type="number" id="qtd-m" placeholder="0" min="0">
                        </div>
                        <div class="campo">
                            <label>G</label>
                            <input type="number" id="qtd-g" placeholder="0" min="0">
                        </div>
                        <div class="campo">
                            <label>GG</label>
                            <input type="number" id="qtd-gg" placeholder="0" min="0">
                        </div>
                    </div>
            <label class="labels">Imagem do produto: </label>
            <input type="file" id="imagem-produto">
            <label for="labels">Onde vai ficar? (se selecionar vai para destaques e se não vai ficar apenas em nossos produtos)</label>
            <label for="labels">Destaque</label>
            <input type="checkbox" id="destaque-produto">

            <button type="submit" id="btn-adicionar-produto">Adicionar</button>
        </form>
    </section>
</main>

<script type="module">

// Importando as ferramentas do Firebase (para os botões de excluir/listar)
    import { monitorarEstoque, cadastrarProduto, deletarProduto } from "./produtos.js";
    import { onAuthStateChanged } from "firebase/auth";
    import { auth } from "./firebase.js";
    
    const EMAIL_ADMIN = "contato.liridelirios@gmail.com";

    onAuthStateChanged(auth, (usuario) => {
        if (!usuario || usuario.email !== EMAIL_ADMIN){
            window.location.href = "/admin/login.html";
        }
    })

    const corpoTabela = document.getElementById("listar-produtos-estoque");

    monitorarEstoque((produtos) => {
        corpoTabela.innerHTML = produtos.map(p => `
        <tr>
            <td><img src="${p.imgURL}" width="50"></td>
            <td>${p.nome}</td>
            <td>${p.categoria}</td>
            <td class="${p.estoque.quantidade < 3 ? 'alerta' : ''}">
            ${p.estoque.quantidade}</td>
            <td>
                <button class="btn-excluir" data-id="${p.id}">Excluir</button>
            </td>
        </tr>
        `).join('');
    });

    corpoTabela.addEventListener("click", async (event) => {
        if (event.target.classList.contains("btn-excluir")){
            const id = event.target.dataset.id;
            const confirmar = confirm("Deseja mesmo remover este item do catálogo?")

            if(confirmar){
                try{
                    await deletarProduto(id);
                    alert("Produto removido com sucesso!")
                }catch(error){
                    console.error("Erro ao remover: ", error);
                }
            }
        }
    })
    const btnSalvar = document.getElementById("btn-adicionar-produto");
    btnSalvar.addEventListener("click", async (event) => {
        event.preventDefault();
        const nomeProduto = document.getElementById("nome-produto").value;
        const precoDigitado = parseFloat(document.getElementById("valor-produto").value);
        const inputFoto = document.getElementById("imagem-produto");
        const descricaoProduto = document.getElementById("descricao-produto").value;
        const categoriaProduto = document.getElementById("categoria-produto").value;

        const arquivoSelecionado = inputFoto.files[0];

        if (!arquivoSelecionado || nomeProduto === ""){
            alert("Preencha todos os campos obrigatórios");
            return;
        }
        const produto = {
            nome: nomeProduto,
            preco: precoDigitado,
            descricao: descricaoProduto,
            categoria: categoriaProduto,
            imagem: arquivoSelecionado,
            destaque: document.getElementById("destaque-produto").checked,
            estoque: {
                P: parseInt(document.getElementById('qtd-p').value) || 0,
                M: parseInt(document.getElementById('qtd-m').value) || 0,
                G: parseInt(document.getElementById('qtd-g').value) || 0,
                GG: parseInt(document.getElementById('qtd-gg').value) || 0,

            }
        };
        try{
            await cadastrarProduto(produto);
            alert("Produto adicionado com sucesso!");
            document.querySelector(".adicionarProduto").reset();
        }catch(error){
            console.error("Erro ao adicionar produto: ", error);
            alert("Erro ao adicionar produto. Veja o console para detalhes.");
        }
    });
</script>
</body>
</html>
