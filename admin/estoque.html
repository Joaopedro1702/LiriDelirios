<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../stylepadrao.css">
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
    <script type="module" src="/admin/estoque.js" defer></script>
    <style>
        body { visibility: hidden; }

        gestao-estoque {
            padding: 20px;
        }
        .gestao-estoque h2 {
            margin-bottom: 20px;
            text-align: center;
        }
        #tabela-estoque {
            width: 100%;
            border-collapse: collapse;
        }
        #tabela-estoque th,
        #tabela-estoque td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }
        .adcProduto {
            margin-top: 40px;
            padding: 20px;
            border: 1px solid #ccc;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .adcProduto label,
        .adcProduto input,
        .adcProduto select,
        .adcProduto button{
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .adcProduto .linha{
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
        }
        /*Box de atualização de pedidos*/

        /* Container principal do painel de vendas */
        .painel-vendas {
            position: fixed;            /* Mantém o painel fixo na tela ao rolar */
            top: 20px;                  /* Distância do topo */
            right: 20px;                /* Distância da direita */
            width: 320px;               /* Largura fixa para manter o padrão */
            background-color: #ffffff;  /* Fundo branco para contraste */
            border-top: 4px solid #7B1A2E; /* Faixa superior com o bordô da marca */
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1); /* Sombreamento suave (depth) */
            border-radius: 8px;         /* Bordas levemente arredondadas */
            padding: 16px;
            z-index: 9999;              /* Garante que fique acima de outros elementos */
            font-family: 'Jost', sans-serif;
        }

        /* Estilo do título com a cor bordô da loja */
        .painel-vendas h2 {
            color: #7B1A2E;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.2rem;
            margin: 0 0 8px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Status do monitoramento (pequeno e discreto) */
        #status-conexao {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #888;
            display: block;
            margin-bottom: 15px;
        }

        /* Indicador visual de "Ativo" */
        .status-online::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #4CAF50; /* Verde para indicar atividade */
            border-radius: 50%;
            margin-right: 6px;
        }

        /* Container que recebe as vendas via JS */
        .feed-container {
            max-height: 400px;         /* Limita a altura com scroll interno */
            overflow-y: auto;
            font-size: 14px;
        }

        /* Estilo dos cards de venda do innerHTML */
        .card-venda-nova {
            border-bottom: 1px solid #f0e0e4;
            padding: 10px 0;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(10px); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
    <title>Estoque</title>
</head>
<body>
        <header class="header">
        <img src="../imagem/logolirios.png" alt="Logo Liri Delirios" class="logo">
    </header>
        <nav class="nav">
    <ul>
        <li><a href="#">Gestão de estoque</a></li>
        <li><a href="#">Vestidos</a></li>
    </ul>
</nav>
<main>

    <div class="gestao-estoque">
        <h2>Gestão de estoque - Liri de Lírios</h2>
        <table id="tabela-estoque">
            <thead>
                <tr>
                    <th>Foto</th>
                    <th>Produtos</th>
                    <th>Categoria</th>
                    <th>Qtd</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="listar-produtos-estoque"></tbody>
        </table>
    </div>

    <section class="adcProduto">
        <h2>Adicionar produto</h2>
        <form class="adicionarProduto" >
            <label class="labels">Nome do produto: </label>
            <input type="text" id="nome-produto" placeholder="Nome do produto">
            <label class="labels">Valor do produto: </label>
            <input type="text" id="valor-produto" placeholder="valor do produto">
            <label class="labels">Descrição do produto: </label>
            <input type="text" id="descricao-produto" placeholder="Descrição do produto">
            <label class="labels">Categoria do produto: </label>
            <input type="text" id="categoria-produto" placeholder="Categoria do produto">
            <label>Quantidade por tamanho:</label>
                    <div class="campo-grupo">
                        <div class="campo">
                            <label>P</label>
                            <input type="number" id="qtd-p" placeholder="0" min="0">
                        </div>
                        <div class="campo">
                            <label>M</label>
                            <input type="number" id="qtd-m" placeholder="0" min="0">
                        </div>
                        <div class="campo">
                            <label>G</label>
                            <input type="number" id="qtd-g" placeholder="0" min="0">
                        </div>
                        <div class="campo">
                            <label>GG</label>
                            <input type="number" id="qtd-gg" placeholder="0" min="0">
                        </div>
                    </div>
            <label class="labels">Imagem do produto: </label>
            <input type="file" id="imagem-produto">
            <label for="labels">Onde vai ficar? (se selecionar vai para destaques e se não vai ficar apenas em nossos produtos)</label>
            <label for="labels">Destaque</label>
            <input type="checkbox" id="destaque-produto">

            <button type="submit" id="btn-adicionar-produto">Adicionar</button>
        </form>
    </section>

    <section class="painel-vendas">
    <div class="header-vendas">
        <h2>Últimas Vendas Confirmadas 🌸</h2>
        <span id="status-conexao" class="status-online">Monitoramento Ativo</span>
    </div>

    <div id="feed-pedidos" class="feed-container">
        <div class="msg-espera">
            <p>Aguardando novas transações em tempo real...</p>
        </div>
    </div>
</section>

<audio id="audio-notificacao" src="../sons/venda-sucesso.mp3" preload="auto"></audio>

</main>

</body>
</html>
