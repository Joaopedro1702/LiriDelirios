<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>Admin — Liri de Lírios</title>
  <script type="module" crossorigin src="/admin/login.js"></script>
  <link rel="modulepreload" crossorigin href="/sweetalert2.all.js">
  <link rel="modulepreload" crossorigin href="/firebase.js">
  <link rel="stylesheet" crossorigin href="/stylepadrao.css">
</head>
<body>
    <main style="max-width: 400px; margin: 80px auto; padding: 0 24px;">
        <h1 style="font-family: var(--font-serif); font-weight: 400; text-align: center; color: var(--color-primary); margin-bottom: 32px;">Área Administrativa</h1>

        <div style="display: flex; flex-direction: column; gap: 12px;">
            <input type="email" id="email" placeholder="E-mail" style="padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px;">
            <input type="password" id="senha" placeholder="Senha" style="padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px;">
            <button id="btn-entrar" style="padding: 12px; background: #7B1A2E; color: #fff; border: none; border-radius: 4px; font-size: 14px; cursor: pointer; letter-spacing: 0.1em;">ENTRAR</button>
        </div>
    </main>

</body>
</html>
